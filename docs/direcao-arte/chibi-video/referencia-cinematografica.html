<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aventuras do Davi: protótipo visual chibi</title>
<style>
/* Copia técnica do protótipo cinematográfico enviado pelo responsável.
   Para não redistribuir fontes binárias embutidas, as regras @font-face data: foram
   substituídas pela família pública Fredoka nesta referência de desenvolvimento.
   O jogo final LAN NÃO deve depender de CDN nem desta página autônoma. */
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');




:root{
  --ink:#34264A;          /* tinta das linhas: mesma do contorno 3D */
  --paper:#FFFFFF;
  --gem:#FFC93C;          /* só para o que é tocável */
  --leaf:#9BE07A;
  --leaf-ink:#2F7A45;
  --teal:#5FD3C4;
  --bar:#F2FBF5;
  --page-bg:#DFF2EA;
  --page-ink:#34264A;
  --r-lg:28px; --r-md:18px; --r-sm:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--page-bg:#1F2B33;--page-ink:#F4F1FF;color-scheme:dark}
}
:root[data-theme="dark"]{--page-bg:#1F2B33;--page-ink:#F4F1FF;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page-bg);color:var(--ink);font-family:"Fredoka",ui-rounded,"Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;padding:10px 20px 14px;max-width:1440px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;height:78px;padding:0 54px;flex:none}
.brand{display:flex;align-items:center;gap:12px;color:var(--page-ink)}
.logo{width:50px;height:50px;border-radius:16px;background:var(--gem);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;transform:rotate(-6deg)}
.brand b{display:block;font-weight:700;font-size:25px;line-height:1}
.brand span{display:block;font-weight:600;font-size:15px;line-height:1.1;letter-spacing:.02em}
.tabs{display:flex;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:5px;box-shadow:0 4px 0 var(--ink)}
.tab{border:0;background:none;border-radius:999px;padding:9px 16px;font-weight:600;font-size:16px;display:flex;gap:8px;align-items:center;cursor:pointer}
.tab.on{background:var(--ink);color:#fff}

/* cartão do jogo */
.card{flex:1;min-height:0;display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:var(--r-lg);overflow:hidden;background:var(--bar);box-shadow:0 6px 0 var(--ink)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#CDEFFF}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none}
.hud button{pointer-events:auto}

.chunk{border:3px solid var(--ink);background:var(--paper);border-radius:var(--r-sm);box-shadow:0 4px 0 var(--ink);font-weight:600;font-size:16px;padding:9px 15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;line-height:1}
.chunk:focus-visible,.tab:focus-visible,.pad:focus-visible{outline:3px solid var(--gem);outline-offset:3px}

.place{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:11px;background:var(--paper);border:3px solid var(--ink);border-radius:var(--r-md);box-shadow:0 4px 0 var(--ink);padding:8px 18px 9px 9px}
.place-ico{width:40px;height:40px;border-radius:12px;background:var(--leaf);border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.place-region{display:block;font-size:13px;font-weight:600;color:var(--leaf-ink);line-height:1.1}
.place-names{display:grid;overflow:hidden;height:30px}
.place-names span{grid-area:1/1;font-size:24px;font-weight:700;line-height:30px;white-space:nowrap}

.tr{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tr-row{display:flex;gap:8px}
.now{background:var(--teal)}
.round{width:42px;height:42px;padding:0;justify-content:center;border-radius:50%}
.sq{width:46px;height:42px;padding:0;justify-content:center}

.dpad{position:absolute;left:16px;bottom:18px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:7px}
.pad{border:3px solid var(--ink);background:rgba(255,255,255,.9);border-radius:16px;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.pad.on{background:var(--gem);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad.up{grid-column:2;grid-row:1}.pad.lf{grid-column:1;grid-row:2}.pad.dn{grid-column:2;grid-row:2}.pad.rt{grid-column:3;grid-row:2}

.actions{position:absolute;right:16px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.ask .mini{width:26px;height:26px}
.act{background:var(--gem);font-size:21px;font-weight:700;padding:11px 20px 11px 11px;border-radius:20px;box-shadow:0 5px 0 var(--ink);transform-origin:100% 50%}
.act .ico{width:40px;height:40px;border-radius:12px;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center}

.bubble{position:absolute;left:0;top:0;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:9px 14px;font-weight:600;font-size:18px;white-space:nowrap;transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:18px;height:18px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:4px}

.toast{position:absolute;left:50%;top:21%;background:var(--leaf);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:10px 30px 14px;text-align:center}
.toast small{display:block;font-size:16px;font-weight:600;color:var(--leaf-ink)}
.toast strong{display:block;font-size:36px;font-weight:700;line-height:1.05}

.bar{flex:none;border-top:3px solid var(--ink);padding:12px 18px 9px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stars{background:var(--gem);min-width:74px;justify-content:center;font-size:18px;font-weight:700}
.stars .n{display:inline-block;min-width:12px;text-align:center}
.hint{flex-basis:100%;margin:2px 0 0;font-size:13.5px;font-weight:500;color:#5A4C6E}

@media (max-width:760px){
  .top{padding:0 6px;height:64px}.brand b{font-size:21px}.tab span{display:none}
  .place-names span{font-size:19px}.dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px)}
  .act{font-size:18px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>

            <button class="chunk round" aria-label="Centralizar câmera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34264A" stroke-width="2.8"><circle cx="12" cy="12" r="3.5" fill="#FFC93C"/><circle cx="12" cy="12" r="8"/></svg></button>

        <div class="dpad" aria-label="Andar">
          <button class="pad up" id="padUp" aria-label="Frente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34264A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>

          <button class="pad rt" aria-label="Direita"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34264A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

          <button class="chunk act" id="act"><span class="ico" id="actIco"></span><span id="actTxt">Soltar um barquinho</span></button>

    </div>
    <footer class="bar">
      <button class="chunk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34264A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.4" fill="#FFC93C"/><circle cx="18" cy="6" r="2.4" fill="#5FD3C4"/><path d="M8.2 17c5 0 2-10 7.6-10.4" stroke-dasharray="2.2 3"/></svg>Caminhos</button>
      <button class="chunk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34264A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="4"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Ver agenda</button>

  </section>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const CAPTURE = new URLSearchParams(location.search).has('capture');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = 20;

/* ---------- utilidades ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k);};
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const backOut=k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry(20261118);const rnd=(a,b)=>a+(b-a)*R();const pick=a=>a[Math.floor(R()*a.length)];

/* ---------- paleta ---------- */
const P={ink:0x34264A,grassL:0xB2E57F,grassM:0x86CF63,grassD:0x62B860,forest:0x6FC06B,
 sand:0xF7D9A2,sandEdge:0xE6B97B,pebble:0xCBC5DE,
 water:0x56C8F2,waterL:0x9FE3FA,foam:0xF2FCFF,
 bark:0xA06D47,woodL:0xE6B47A,woodD:0x7E5236,
 leafA:0x5BC46F,leafB:0x7DD66C,leafC:0x46B377,blossom:0xFFAACB,
 rock:0xC4BFDB,rockB:0xAEA8CC,moss:0x92D36B,
 gem:0xFFC93C,coral:0xFF7A59,teal:0x3CBDB4,lilac:0xB39AF2,white:0xFFFFFF,
 skin:0xFFDABB,cheek:0xFF9CA3,hair:0x7A4A2C,shirt:0x37B99B,shorts:0x8A5C3D,shoe:0xFF7A59,pack:0xFF9F4A,glasses:0x2B8DCC,
 pipo:0xF4F8FF,visor:0x3A3157,pipoEye:0x7CF5EA,pipoWing:0x46C2D9,hog:0x9A6340,hogD:0x6E4129,hogFace:0xFFE6C4};

/* ---------- renderer ---------- */
const stage=document.getElementById('stage');
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:CAPTURE,powerPreference:'high-performance'});
renderer.setPixelRatio(CAPTURE?1:Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const FOG=0xDDF2FA;
scene.fog=new THREE.Fog(FOG,24,72);
scene.background=new THREE.Color(FOG);
const camera=new THREE.PerspectiveCamera(40,1,.1,500);
const RES=new THREE.Vector2(1,1);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.getDrawingBufferSize(RES);}
resize();addEventListener('resize',resize);

/* ---------- materiais ---------- */
const GRAD=(()=>{const t=new THREE.DataTexture(new Uint8Array([110,190,255]),3,1,THREE.RedFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t;})();
const toon=(color,o={})=>new THREE.MeshToonMaterial({color,gradientMap:GRAD,...o});
const VC=toon(0xffffff,{vertexColors:true});
const fogU=()=>THREE.UniformsUtils.clone(THREE.UniformsLib.fog);
const outlineCache=new Map();
function outlineMat(px,color=P.ink,shared=true){
  const key=px+'_'+color;
  if(shared&&outlineCache.has(key))return outlineCache.get(key);
  const m=new THREE.ShaderMaterial({
    uniforms:{...fogU(),uColor:{value:new THREE.Color(color)},uPx:{value:px},uRes:{value:RES},uOpacity:{value:1}},
    vertexShader:`uniform float uPx;uniform vec2 uRes;
      #include <fog_pars_vertex>
      void main(){vec4 mvPosition=modelViewMatrix*vec4(position,1.0);vec4 clip=projectionMatrix*mvPosition;
        vec3 n=normalize(normalMatrix*normal);vec2 d=n.xy;float l=length(d);if(l>1e-4)d/=l;
        float px=uPx*clamp(9.0/max(-mvPosition.z,0.001),0.4,1.0);
        clip.xy+=d*px*2.0/uRes*clip.w;gl_Position=clip;
        #include <fog_vertex>
      }`,
    fragmentShader:`uniform vec3 uColor;uniform float uOpacity;
      #include <fog_pars_fragment>
      void main(){gl_FragColor=vec4(uColor,uOpacity);
        #include <fog_fragment>
        #include <colorspace_fragment>
      }`,
    side:THREE.BackSide,fog:true});
  if(shared)outlineCache.set(key,m);
  return m;
}
function mk(geo,mat,{outline=0,ocol=P.ink,cast=true,recv=true,own=false}={}){
  const m=new THREE.Mesh(geo,mat);m.castShadow=cast;m.receiveShadow=recv;
  if(outline){const o=new THREE.Mesh(geo,outlineMat(outline,ocol,!own));o.castShadow=false;o.receiveShadow=false;m.add(o);m.userData.outline=o;}
  return m;
}
const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),_s=new THREE.Vector3();
function part(geo,color,pos=[0,0,0],rot=[0,0,0],scl=[1,1,1]){
  let g=geo.index?geo.toNonIndexed():geo.clone();
  for(const k of Object.keys(g.attributes))if(k!=='position'&&k!=='normal'&&k!=='color')g.deleteAttribute(k);
  _m.compose(_v.set(...pos),_q.setFromEuler(_e.set(...rot)),_s.set(...(typeof scl==='number'?[scl,scl,scl]:scl)));
  g.applyMatrix4(_m);
  if(!g.attributes.color){const c=new THREE.Color(color),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}g.setAttribute('color',new THREE.BufferAttribute(a,3));}
  return g;
}
const SPH=new THREE.SphereGeometry(1,20,14);
const SPHlo=new THREE.SphereGeometry(1,12,9);

/* ---------- rota ---------- */
const route=new THREE.CatmullRomCurve3([[-0.6,9.5],[0,6],[0.3,3],[1.4,0],[1.9,-3.4],[0.9,-6.8],[-1,-9.8],[-1.9,-12.8],[-1.4,-15.7],[0.3,-18.3],[1.5,-21.2],[1.7,-24.2]].map(([x,z])=>new THREE.Vector3(x,0,z)),false,'centripetal');
const L=route.getLength();
const sAtPoint=v=>{let best=1e9,bs=0;for(let i=0;i<PS.n;i++){const dx=PS.x[i]-v[0],dz=PS.z[i]-v[1];const d=dx*dx+dz*dz;if(d<best){best=d;bs=PS.s[i];}}return bs;};
const PS={n:480,x:[],z:[],s:[]};
for(let i=0;i<PS.n;i++){const u=i/(PS.n-1);const p=route.getPointAt(u);PS.x.push(p.x);PS.z.push(p.z);PS.s.push(u*L);}
const sStart=sAtPoint([0,6]);
const sEnd=L;
const sWheel=sStart+6.3,sGate=sStart+13.0,sStream=sStart+18.4,sStar=sStart+25.6;
const at=s=>route.getPointAt(clamp(s/L));
const tan=s=>route.getTangentAt(clamp(s/L));
const rightOf=T=>new THREE.Vector3(-T.z,0,T.x);
const smoothTan=s=>{const f=new THREE.Vector3();for(let k=-3;k<=3;k++)f.add(tan(s+k*.7));f.y=0;return f.normalize();};
const rotY=(v,a)=>new THREE.Vector3(v.x*Math.cos(a)+v.z*Math.sin(a),v.y,-v.x*Math.sin(a)+v.z*Math.cos(a));
const END_AZ=1.62,END_DIST=5.9,END_H=1.4;

  const tk=popK(t,tArea+.1,tArea+1.75,.4,.3);$('toast').style.opacity=tk>0?Math.min(1,tk*1.5):0;$('toast').style.transform=`translate(-50%,-50%) scale(${.6+.4*tk}) rotate(${(1-tk)*-4}deg)`;
  const kb=popK(t,tWheelA,tWheelB),kl=popK(t,tLeaf,99);
  const kind=kl>0?'leaf':'boat',ka=Math.max(kb,kl);
  if(kind!==actKind){actKind=kind;$('actIco').innerHTML=ICON[kind];$('actTxt').textContent=kind==='leaf'?'Virar a folha':'Soltar um barquinho';}
  const wob=ka>=1?1+.03*Math.sin(t*6):1;$('act').style.transform=`scale(${ka*wob})`;$('act').style.opacity=ka>0?1:0;
  $('padUp').classList.toggle('on',walking);
  const got=t>=tStar;$('starN').textContent=got?'1':'0';const sb=got?1+.35*Math.exp(-(t-tStar)*5)*Math.cos((t-tStar)*14):1;$('stars').style.transform=`scale(${sb})`;
  const b=bubbles.find(([a,z])=>t>=a&&t<=z+.25);const el=$('bubble');
  if(b){const kk=popK(t,b[0],b[1],.3,.22);if(el.textContent!==b[2])el.textContent=b[2];camera.updateMatrixWorld();_p.copy(pipoPos);_p.y+=.48;_p.project(camera);
    const w=stage.clientWidth,h=stage.clientHeight;const x=(_p.x+1)/2*w,y=(1-_p.y)/2*h;
    el.style.opacity=kk>0?1:0;el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%) translateY(-14px) scale(${kk})`;}
  else el.style.opacity=0;
}

/* ---------- quadro ---------- */
const UP=new THREE.Vector3(0,1,0);
const camPos=new THREE.Vector3(),look=new THREE.Vector3();

function update(t){
  const s=sAt(t);const p=at(s),T=tan(s);const walking=t>T0+.05&&t<T1-.05;
  const speed=(sAt(t+.01)-sAt(t-.01))/.02;
  /* Davi */
  let y=H(p.x,p.z);let mode='walk';let hopF=0;
  if(s>sA&&s<sB){mode='hop';const x=(s-sA)/HSEG;const i=Math.floor(x);hopF=x-i;y=lerp(hopY(i),hopY(i+1),hopF)+Math.sin(Math.PI*hopF)*.42;}
  if(!walking)mode=t>=T1?'end':'idle';
  let yaw=Math.atan2(T.x,T.z);
  if(t<T0)yaw=Math.atan2(T.x,T.z);
  davi.root.position.set(p.x,y,p.z);davi.root.rotation.y=yaw;
  const ph=(s-sStart)*(Math.PI*2/1.05);const kw=clamp(speed/1.6);
  const d=davi;d.body.position.y=0;d.body.scale.set(1,1,1);d.head.rotation.set(0,0,0);
  d.legs.forEach((l,i)=>l.rotation.set(0,0,0));d.arms.forEach((a,i)=>{a.rotation.set(0,0,(i?1:-1)*.28);});
  if(mode==='walk'){
    d.legs[0].rotation.x=Math.sin(ph)*.75*kw;d.legs[1].rotation.x=-Math.sin(ph)*.75*kw;
    d.arms[0].rotation.x=-Math.sin(ph)*.7*kw;d.arms[1].rotation.x=Math.sin(ph)*.7*kw;
    d.body.position.y=Math.abs(Math.sin(ph))*.075*kw;d.body.scale.y=1-.035*Math.cos(ph*2)*kw;d.body.rotation.x=.07*kw;
    d.head.rotation.z=Math.sin(ph)*.06*kw;d.head.rotation.x=-.04*kw;
  }else if(mode==='hop'){
    const air=Math.sin(Math.PI*hopF);const land=Math.max(0,1-hopF/.18)+Math.max(0,(hopF-.82)/.18);
    d.legs[0].rotation.x=-.5*air;d.legs[1].rotation.x=.3*air;d.arms[0].rotation.z=-.28-1.3*air;d.arms[1].rotation.z=.28+1.3*air;
    d.body.scale.y=1+.08*air-.1*land;d.body.scale.x=d.body.scale.z=1-.03*air+.06*land;d.body.rotation.x=.12*air;
  }else{
    const br=Math.sin(t*2.6);d.body.scale.y=1+.018*br;d.head.rotation.z=Math.sin(t*1.3)*.05;d.body.rotation.x=0;
    if(t<T0){const wv=sstep(.3,.6,t)*(1-sstep(1.0,1.25,t));d.arms[1].rotation.z=.28+2.3*wv;d.arms[1].rotation.x=-.2*wv+Math.sin(t*16)*.25*wv;}
    if(t>=tCheer){const c=clamp((t-tCheer)/.55);const j=Math.sin(Math.PI*c)*.38;davi.root.position.y+=j;d.arms[0].rotation.z=-.28-2.4*Math.sin(Math.PI*Math.min(1,c*1.4));d.arms[1].rotation.z=.28+2.4*Math.sin(Math.PI*Math.min(1,c*1.4));d.body.scale.y=1+.07*Math.sin(Math.PI*c)-.06*Math.max(0,1-Math.abs(c-1)*6);}
  }
  if(t>=T1){const tgt=Math.atan2(logC.x-p.x,logC.z-p.z);davi.root.rotation.y=lerp(yaw,tgt,sstep(T1,T1+.5,t));}
  d.eyes.forEach(e=>{const bl=(t%3.7>3.55)||(t>9.1&&t<9.2)?.15:1;e.scale.y=bl;});
  d.shadow.position.set(p.x,Math.max(H(p.x,p.z),mode==='hop'?STONE_TOP-.02:-1)+.03,p.z);const sh=1-clamp((davi.root.position.y-Math.max(H(p.x,p.z),0))*1.2,0,.5);d.shadow.scale.setScalar(sh);d.shadow.material.opacity=sh;
  /* pedras afundam quando Davi pisa */
  stones.forEach(st=>{const dd=Math.abs(s-st.s);st.m.position.y=-.2-(mode==='hop'?.05*Math.max(0,1-dd/.25):0)+Math.sin(t*2+st.s)*.008;});
  /* Pipo */
  const R1=rightOf(T);const lag=at(s-.5);let pp=new THREE.Vector3(lag.x,0,lag.z).addScaledVector(R1,-.85);pp.y=Math.max(H(pp.x,pp.z),0)+1.32+Math.sin(t*3.1)*.09;
  if(t>T1-.2){const endP=E.clone().addScaledVector(ER,END_SIDE*.85).addScaledVector(ET,.75);endP.y=1.38+Math.sin(t*3.1)*.09;pp.lerp(endP,sstep(T1-.2,T1+.8,t));}
  pipo.root.position.copy(pp);pipo.root.rotation.y=t>=T1?lerp(yaw,Math.atan2(logC.x-pp.x,logC.z-pp.z),sstep(T1,T1+.6,t)):yaw;
  const flap=t<T0||t>tHog?22:13;pipo.wings[0].rotation.z=.5+Math.sin(t*flap)*.55;pipo.wings[1].rotation.z=-.5-Math.sin(t*flap)*.55;
  pipo.body.rotation.z=Math.sin(t*2.2)*.08;pipo.body.rotation.x=walking?.18:0;
  if(t>tCheer){const c=clamp((t-tCheer)/.7);pipo.body.rotation.y=easeIO(c)*Math.PI*2;}else pipo.body.rotation.y=0;
  pipo.shadow.position.set(pp.x,Math.max(H(pp.x,pp.z),-.15)+.03,pp.z);pipo.shadow.material.opacity=.55;
  /* ambiente */
  waters.forEach(w=>w.uniforms.uTime.value=t);fireflies.uniforms.uTime.value=t;pollen.uniforms.uTime.value=t;marks.uniforms.uTime.value=t*1.6;
  wheel.spin.rotation.z=-t*1.1;
  const bk=((t*.16)+.05)%1;wheel.boat.position.set(lerp(-wheel.len/2+.4,wheel.len/2-.5,bk),.36+Math.sin(t*4)*.015,Math.sin(t*1.7)*.05);wheel.boat.rotation.set(Math.sin(t*3)*.06,0,Math.sin(t*2.3)*.05);
  const bs=sstep(0,.08,bk)*(1-sstep(.9,1,bk));wheel.boat.scale.setScalar(Math.max(.001,bs));
  const kb=popK(t,tWheelA,tWheelB);wheel.boat.userData.outline.material.uniforms.uColor.value.set(kb>.05?P.gem:P.ink);wheel.boat.userData.outline.material.uniforms.uPx.value=3+2.5*kb;
  flags.forEach((f,i)=>{f.rotation.x=Math.sin(t*2.6+i*.8)*.3;});
  /* marcador de interação */
  const kl=popK(t,tLeaf,99);
  if(kb>.05){wheel.boat.getWorldPosition(_v);markPts.position.copy(_v).add(new THREE.Vector3(0,.25,0));marks.uniforms.uOp.value=kb;markPts.visible=true;}
  else if(kl>.05){markPts.position.copy(leaf.g.position).add(new THREE.Vector3(0,.15,0));marks.uniforms.uOp.value=kl;markPts.visible=true;}else markPts.visible=false;
  leaf.glow.material.opacity=kl*(.75+.25*Math.sin(t*6));leaf.g.position.y=H(leaf.g.position.x,leaf.g.position.z)+.07+kl*.05*Math.sin(t*4);
  /* estrela */
  if(t<tStar){star.m.visible=true;star.m.position.copy(star.base);star.m.position.y+=Math.sin(t*2.4)*.1;star.m.rotation.y=t*2;star.m.scale.setScalar(1);burst.visible=false;}
  else{const k=clamp((t-tStar)/.45);star.m.visible=k<1;star.m.position.copy(star.base);star.m.position.y+=easeIO(k)*1.3;star.m.rotation.y=t*2+k*8;star.m.scale.setScalar(Math.max(.001,(1+.4*Math.sin(Math.PI*k))*(1-k)));burst.visible=t-tStar<.8;burst.position.copy(star.base).add(new THREE.Vector3(0,.5,0));burstM.uniforms.uK.value=clamp((t-tStar)/.8);}
  /* ouriço */
  const hk=clamp((t-tHog)/.5);const hb=t<tHog?0:backOut(hk);hog.g.position.set(0,-.38+Math.sin(Math.PI*hk)*.16,lerp(.2,-1.62,hb));hog.g.rotation.x=0;
  hog.g.scale.setScalar(t<tHog?.001:1);hog.g.rotation.z=t>tHog+.5?Math.sin((t-tHog)*5)*.08:0;
  /* câmera */
  const fwd=smoothTan(s);const base=new THREE.Vector3(p.x,0,p.z);
  const kIntro=easeIO(clamp((t-.55)/2.3)),kEnd=easeIO(clamp((t-17.4)/2.0));
  const az=lerp(Math.PI*.93,0,kIntro)+kEnd*END_AZ;
  const dist=lerp(lerp(4.1,5.5,kIntro),END_DIST,kEnd),hgt=lerp(lerp(1.2,2.55,kIntro),END_H,kEnd);
  const target=base.clone().add(new THREE.Vector3(0,.85,0));
  const mid=new THREE.Vector3(lerp(p.x,logC.x,.3),.62,lerp(p.z,logC.z,.3));
  const lookAtT=target.clone().addScaledVector(fwd,1.3*kIntro*(1-kEnd)).lerp(mid,kEnd);
  const back=rotY(fwd.clone().negate(),az);
  camPos.copy(lerp(0,1,1)?target:target).addScaledVector(back,dist).add(new THREE.Vector3(0,hgt,0));
  camera.position.copy(camPos);camera.lookAt(lookAtT);
  sun.position.copy(target).addScaledVector(SUN,30);sun.target.position.copy(target);sun.target.updateMatrixWorld();
  /* árvores entre a câmera e o Davi ficam translúcidas */
  const segs=[target,lookAtT].map(q=>{const d=q.clone().sub(camPos);const l=d.length();return{d:d.normalize(),l};});
  trees.forEach(tr=>{let op=1;
    for(const sg of segs){const v=tr.c.clone().sub(camPos);const along=v.dot(sg.d);
      if(along>0&&along<sg.l+.5){const dd=v.addScaledVector(sg.d,-along).length();op=Math.min(op,lerp(.2,1,sstep(tr.r*.55,tr.r*1.25,dd)));}}
    const nearCam=Math.min(tr.c.distanceTo(camPos)-tr.r,Math.hypot(tr.x-camPos.x,tr.z-camPos.z)-.6);op=Math.min(op,lerp(.18,1,sstep(.2,2.2,nearCam)));
    const tp=op<.99;tr.mat.transparent=tp;tr.mat.opacity=op;tr.mat.depthWrite=!tp;tr.o.visible=!tp;tr.m.castShadow=true;});
  {const dpl=Math.abs(camPos.clone().sub(gate.c).dot(gate.n));const lat=Math.abs(camPos.clone().sub(gate.c).dot(rightOf(gate.n)));
   const op=1-sstep(sGate+.3,sGate+1.3,s)*(1-sstep(sGate+4.9,sGate+5.8,s));const tp=op<.99;
   gate.mats.forEach(m=>{m.transparent=tp;m.opacity=op;m.depthWrite=!tp;m.visible=op>.04;});gate.outs.forEach(o=>o.visible=!tp);}
  hud(t,walking,pp);
}

window.__times={tArea,tStar,tHopA,tHopB,tWheelA,tWheelB};
window.renderAt=t=>{update(t);renderer.render(scene,camera);return true;};
await document.fonts.ready;
if(CAPTURE){window.renderAt(0);window.__ready=true;}
else{
  const t0=performance.now();
  const loop=()=>{const t=REDUCED?6.5:((performance.now()-t0)/1000)%(DUR+1.2);window.renderAt(Math.min(t,DUR));if(!REDUCED)requestAnimationFrame(loop);};
  loop();if(REDUCED)addEventListener('resize',()=>window.renderAt(6.5));
}
</script>
