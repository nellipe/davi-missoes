<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><meta name="description" content="Aventuras do Davi: pequenas missões para conquistar autonomia, no seu ritmo.">
<title>Aventuras do Davi | Missões do Dia</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7fbff;background:#0b1222;font-size:16px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#263b66 0%,transparent 46%),linear-gradient(130deg,#10192d,#0b1222 65%)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:15px;min-height:46px;padding:11px 17px;font-weight:750}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #facc15;outline-offset:3px}
button:disabled{opacity:.4;cursor:not-allowed}.primary{color:#171b2d;background:#facc15;box-shadow:0 5px 0 #c78f08}.primary:hover{background:#fde047}.secondary{background:#23365a;color:#fff;border:1px solid #4d6594}.danger{background:#66344c;color:#fff}.tiny{min-height:36px;padding:7px 11px;font-size:.88rem}.ghost{background:transparent;color:#d7e7ff;border:1px solid #4c6182}
header{max-width:1110px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:22px 18px}
.brand{display:flex;align-items:center;gap:11px;font-size:1.2rem;font-weight:950}.cube{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#ffce35;color:#1c2337;box-shadow:5px 5px 0 #b3781d;font-size:1.6rem}
main{max-width:1110px;margin:0 auto;padding:5px 18px 60px}.muted{color:#b7c8e2}.pill{background:#29385a;border:1px solid #4c648a;border-radius:50px;padding:7px 12px;font-size:.82rem}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
.hero{display:grid;grid-template-columns:1fr 300px;gap:30px;align-items:center;padding:25px 28px;border:1px solid #45618a;border-radius:25px;background:linear-gradient(125deg,#263d68,#172846)}
h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;letter-spacing:-.04em;margin:8px 0 13px}h2{font-size:1.45rem;margin:0 0 12px}h3{margin:6px 0}.kicker{text-transform:uppercase;letter-spacing:.16em;color:#fee27b;font-weight:850;font-size:.78rem}
.avatar{width:165px;height:210px;margin:0 auto;position:relative;filter:drop-shadow(9px 12px 0 #0a1b33)}
.avatar .head{position:absolute;top:12px;left:37px;width:92px;height:88px;border:6px solid #202b4d;border-radius:23px;background:#ffd584}
.avatar .head:before,.avatar .head:after{content:"";position:absolute;top:36px;width:12px;height:12px;border-radius:3px;background:#263451}
.avatar .head:before{left:21px}.avatar .head:after{right:21px}.avatar .smile{position:absolute;top:57px;left:34px;width:19px;height:9px;border-bottom:4px solid #263451;border-radius:50%}
.avatar .hair{position:absolute;top:0;left:37px;width:92px;height:30px;background:#362f42;border:5px solid #202b4d;border-radius:15px 15px 4px 4px}
.avatar .body{position:absolute;top:100px;left:24px;width:118px;height:82px;border:6px solid #202b4d;background:#5cd6ff;border-radius:13px}.avatar .body:before{content:"★";position:absolute;top:10px;left:41px;color:#16274b;font-size:28px}
.avatar .legs{position:absolute;top:176px;left:35px;width:96px;height:32px;background:linear-gradient(90deg,#5564e7 0 45%,transparent 45% 55%,#5564e7 55%);border-radius:4px}
section{margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.card{padding:20px;border:1px solid #344f7c;border-radius:20px;background:#172641;box-shadow:0 9px 0 #0b162a}.card:hover{border-color:#92bdff}.card .emoji{font-size:2.5rem;display:block;margin-bottom:8px}.card p{min-height:44px}.card button{width:100%;margin-top:8px}
.panel{border:1px solid #3f5c89;background:#182b4b;padding:24px;border-radius:22px}.step{background:#213c64;border:1px solid #6185b4;border-radius:22px;text-align:center;padding:28px 18px;margin:21px 0}.step .emoji{font-size:clamp(4rem,12vw,7rem);line-height:1.2}.step h2{font-size:clamp(1.5rem,4vw,2.3rem);margin:15px 0}.step p{font-size:1.12rem;max-width:580px;margin:0 auto}
.progress{height:13px;background:#0f1b31;border-radius:50px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#79e7bd,#facc15);transition:width .3s}
.choice{width:100%;text-align:left;margin:5px 0;background:#263d64;color:#fff;border:1px solid #5b7ba9}.choice.selected{background:#476995;border-color:#facc15}.choice.correct{background:#1d7058}
.stack{display:grid;gap:10px}.footer{padding:28px 0;color:#9fb2d0;text-align:center;font-size:.85rem}
input,textarea,select{width:100%;background:#101c33;border:1px solid #7894bf;color:#fff;border-radius:12px;padding:12px;margin:5px 0 12px}label{display:block;font-weight:700}textarea{min-height:105px}fieldset{border:1px solid #465e83;border-radius:14px;margin:13px 0;padding:12px}legend{font-weight:800}code{color:#ffdf77}
.notice{border-left:4px solid #facc15;padding:10px 15px;background:#2f3855;border-radius:8px}.success{background:#174d43;border:1px solid #4eb78f;padding:12px;border-radius:10px}
.hidden{display:none!important}#live{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}
@media(max-width:680px){.hero{grid-template-columns:1fr}.hero .avatar{display:none}.panel{padding:15px}header{align-items:flex-start}.brand{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="brand"><div class="cube" aria-hidden="true">★</div><span>AVENTURAS DO DAVI</span></div><div class="row"><span class="pill" id="wallet">⭐ 0 estrelas</span><button type="button" class="ghost tiny" id="homeBtn">Início</button></div></header>
<main id="app"></main><div aria-live="polite" id="live"></div>
<script>
(function(){
"use strict";
const KEY="davi-missoes-v1";
const DEFAULT=[
{id:"banheiro",name:"Operação Banheiro",icon:"🚽",place:"Banheiro",steps:[["🚪","Entre no banheiro","Abra a porta, entre e feche para ter privacidade."],["🚽","Prepare o vaso","Levante ou abaixe a tampa e o assento conforme precisar."],["🧍","Use o banheiro","Sente-se ou fique em pé, de acordo com o que vai fazer."],["🧻","Faça a higiene","Use papel higiênico e confira se ficou limpo."],["👖","Arrume a roupa","Vista e ajeite a roupa com calma."],["💧","Dê descarga","Acione a descarga e confira."],["🧼","Lave as mãos","Use água e sabonete, esfregando bem."],["👐","Seque as mãos","Seque as mãos, veja se ficou tudo bem e saia."]]},
{id:"dentes",name:"Poder do Sorriso",icon:"🪥",place:"Banheiro",steps:[["🪥","Pegue a escova","Encontre sua escova de dentes."],["🧴","Ponha a pasta","Use a quantidade de pasta combinada com seu responsável."],["😁","Escove os dentes","Escove frente, trás e superfícies de mastigação com cuidado."],["👅","Limpe a língua","Escove a língua delicadamente."],["🚰","Finalize","Cuspa a pasta e enxágue a escova."],["🧽","Guarde tudo","Guarde escova e pasta e deixe a pia organizada."]]},
{id:"banho",name:"Missão Banho",icon:"🚿",place:"Banheiro",steps:[["👕","Separe o necessário","Pegue toalha e roupa limpa."],["🚪","Tenha privacidade","Entre no banheiro e feche a porta."],["🌡️","Confira a água","Peça ajuda se precisar ajustar a temperatura."],["🚿","Molhe o corpo","Molhe o corpo com cuidado."],["🧼","Use o sabonete","Lave o corpo e as áreas que precisam de higiene."],["💦","Enxágue","Retire o sabonete completamente."],["🧻","Seque-se","Desligue a água e seque bem o corpo."],["👕","Vista a roupa","Vista a roupa limpa e guarde o que usou."]]},
{id:"mochila",name:"Inventário da Mochila",icon:"🎒",place:"Quarto",steps:[["📅","Veja o dia de amanhã","Confira com seu responsável as matérias."],["📚","Separe os livros","Coloque os materiais indicados."],["📓","Confira os cadernos","Veja se os cadernos estão na mochila."],["✏️","Prepare o estojo","Confira lápis, borracha e outros itens."],["📄","Veja os recados","Confira tarefas e avisos da escola."],["🎒","Feche e guarde","Feche a mochila e deixe no lugar combinado."]]},
{id:"quarto",name:"Base Organizada",icon:"🛏️",place:"Quarto",steps:[["🛏️","Arrume a cama","Estique a coberta e ajeite o travesseiro."],["👕","Junte as roupas","Coloque a roupa suja no cesto."],["🧸","Guarde os brinquedos","Cada brinquedo volta ao seu lugar."],["📚","Organize os objetos","Guarde livros e materiais da mesa."],["👀","Olhe o quarto","Confira se o caminho está livre e tudo seguro."]]},
{id:"dormir",name:"Portal do Descanso",icon:"🌙",place:"Quarto",steps:[["🎮","Encerre a brincadeira","Salve o jogo e desligue a tela no horário combinado."],["🎒","Prepare o amanhã","Confira mochila e roupa."],["🚿","Faça a higiene","Vá ao banheiro e escove os dentes."],["👕","Coloque o pijama","Vista uma roupa confortável para dormir."],["📖","Hora de desacelerar","Escolha uma história ou atividade tranquila."],["💤","Deite-se","Apague a luz combinada e descanse."]]},
{id:"acordar",name:"Start do Dia",icon:"🌞",place:"Quarto",steps:[["⏰","Acorde","Levante-se e abra os olhos para um novo dia."],["🚽","Vá ao banheiro","Use o banheiro se precisar."],["🛏️","Arrume a cama","Deixe coberta e travesseiro no lugar."],["👕","Vista-se","Coloque a roupa separada."],["🍎","Tome café","Sente e faça sua refeição."],["🪥","Escove os dentes","Faça a higiene antes de sair."]]},
{id:"alimentacao",name:"Missão Refeição",icon:"🍽️",place:"Cozinha",steps:[["🧼","Lave as mãos","Lave as mãos antes de comer."],["🍽️","Prepare seu lugar","Coloque o que precisa na mesa."],["🪑","Sente-se","Sente em um lugar seguro."],["🥗","Faça sua refeição","Coma no seu ritmo e use os talheres."],["🧽","Organize a mesa","Leve seus itens ao lugar combinado."],["👐","Finalize","Limpe as mãos e confira seu espaço."]]},
{id:"sair",name:"Pronto para Sair",icon:"🚀",place:"Entrada",steps:[["👕","Confira a roupa","Veja se está vestido para o passeio."],["👟","Calce os sapatos","Calce e ajuste os sapatos."],["🎒","Pegue seus itens","Confira mochila ou objetos necessários."],["🚰","Veja a garrafinha","Pegue água se for necessário."],["👋","Avise o responsável","Diga que está pronto."],["🚪","Saia acompanhado","Saia com o adulto responsável."]]},
{id:"brincar",name:"Fim da Partida",icon:"🧱",place:"Quarto",steps:[["⏰","Veja o combinado","Confira se chegou a hora de encerrar."],["🎮","Salve o progresso","Salve o jogo, se houver essa opção."],["🔌","Desligue com cuidado","Desligue o dispositivo corretamente."],["🧸","Guarde os objetos","Coloque controles, peças ou brinquedos no lugar."],["🌟","Escolha a próxima atividade","Agora é hora da próxima missão!"]]}
];
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.missions)&&s.missions.length&&typeof s.stars==="number")return s}catch(e){}return{missions:clone(DEFAULT),stars:0,history:[],name:"Davi",sound:true}}
let data=load(),view="home",mission=null,mode="learn",index=0,selection=[],candidate=[],revealed=false;
const app=document.getElementById("app"),live=document.getElementById("live");
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){announce("Não foi possível salvar. Confira o armazenamento do navegador.")}}
function announce(s){live.textContent=s}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function button(text,action,cls){return '<button type="button" class="'+(cls||"primary")+'" data-action="'+action+'">'+text+'</button>'}
function header(title,back){return '<div class="row between"><div><div class="kicker">Missões do Dia</div><h1>'+esc(title)+'</h1></div>'+button("← Voltar",back||"home","secondary")+'</div>'}
function speak(text){if(!data.sound||!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="pt-BR";u.rate=.88;u.pitch=1;const voices=window.speechSynthesis.getVoices();const v=voices.find(x=>x.lang.toLowerCase()==="pt-br");if(v)u.voice=v;window.speechSynthesis.speak(u)}
function stop(){if("speechSynthesis" in window)window.speechSynthesis.cancel()}
function paint(){document.getElementById("wallet").textContent="⭐ "+data.stars+" estrelas";if(view==="home")home();if(view==="detail")detail();if(view==="play")play();if(view==="result")result();if(view==="parent")parent();if(view==="editor")editor();if(view==="achievements")achievements()}
function home(){app.innerHTML='<div class="hero"><div><span class="kicker">Seu mundo de aventuras</span><h1>Olá, '+esc(data.name)+'! 👋</h1><p>Missões pequenas. Grandes conquistas. Escolha uma aventura e avance no seu ritmo!</p><div class="row">'+button("🎮 Escolher missão","missions")+button("🏆 Meu progresso","achievements","secondary")+'</div></div><div class="avatar" aria-hidden="true"><div class="body"></div><div class="legs"></div><div class="head"><div class="smile"></div></div><div class="hair"></div></div></div><section id="missions"><div class="row between"><h2>Mapa de missões</h2><span class="pill">'+data.missions.length+' aventuras</span></div><div class="grid">'+data.missions.map((m,i)=>'<article class="card"><span class="emoji" aria-hidden="true">'+esc(m.icon)+'</span><span class="kicker">Fase '+String(i+1).padStart(2,"0")+'</span><h3>'+esc(m.name)+'</h3><p class="muted">'+esc(m.place)+' · '+m.steps.length+' etapas</p>'+button("Iniciar aventura →","open:"+esc(m.id))+'</article>').join("")+'</div></section><section class="row between"><p class="muted">Sem cronômetro obrigatório. Sem punição por errar.</p>'+button("⚙️ Área do responsável","parent","ghost")+'</section>'}
function detail(){const m=mission;app.innerHTML=header(m.name)+'<div class="panel"><div class="row"><span style="font-size:4rem" aria-hidden="true">'+esc(m.icon)+'</span><div><h2>'+esc(m.place)+'</h2><p class="muted">'+m.steps.length+' pequenos passos. Escolha como jogar.</p></div></div><div class="grid"><div class="card"><h3>📚 Aprender</h3><p>Descubra cada passo com texto, imagem simbólica e voz.</p>'+button("Aprender","start:learn")+'</div><div class="card"><h3>✅ Fazer</h3><p>Acompanhe a tarefa real, um passo por vez.</p>'+button("Fazer a missão","start:do")+'</div><div class="card"><h3>🧠 Lembrar</h3><p>Organize os passos de memória e peça dicas se precisar.</p>'+button("Desafio de memória","start:remember")+'</div></div></div>'}
function play(){const m=mission;if(mode==="remember"){const chosen=selection.length;const options=candidate.map((i,p)=>'<button type="button" class="choice" data-action="pick:'+p+'">'+esc(m.steps[i][0])+' '+esc(m.steps[i][1])+'</button>').join("");app.innerHTML=header("Desafio de memória","detail")+'<div class="panel"><p class="kicker">'+esc(m.name)+'</p><h2>Qual é o próximo passo?</h2><div class="progress"><div style="width:'+Math.round(chosen/m.steps.length*100)+'%"></div></div><p class="muted">Passo '+(chosen+1)+' de '+m.steps.length+'. Você pode pedir uma dica sem perder nada.</p><div class="stack">'+options+'</div><div class="row">'+button("💡 Ouvir dica","hint","secondary")+button("↺ Recomeçar","restart","ghost")+'</div><p id="feedback" role="status" aria-live="polite"></p></div>';return}
const s=m.steps[index];app.innerHTML=header(mode==="learn"?"Modo aprender":"Modo fazer","detail")+'<div class="panel"><div class="row between"><span class="kicker">'+esc(m.name)+'</span><span class="pill">Etapa '+(index+1)+' de '+m.steps.length+'</span></div><div class="progress" aria-label="Progresso"><div style="width:'+Math.round(index/m.steps.length*100)+'%"></div></div><div class="step"><div class="emoji" role="img" aria-label="'+esc(s[1])+'">'+esc(s[0])+'</div><h2>'+esc(s[1])+'</h2><p>'+esc(s[2])+'</p></div><div class="row between"><div class="row">'+button("🔊 Ouvir","speak","secondary")+button("← Anterior","prev","ghost")+'</div>'+button(index===m.steps.length-1?"🏁 Concluir":"Próximo →","next")+'</div><p class="muted">'+(mode==="do"?"Marque próximo quando terminar este passo. Se precisar de ajuda, peça a um adulto.":"Você pode ouvir quantas vezes quiser.")+'</p></div>'}
function complete(){stop();const award=mode==="remember"?3:mode==="do"?2:1;data.stars+=award;data.history.unshift({id:mission.id,name:mission.name,mode,date:new Date().toISOString(),stars:award});data.history=data.history.slice(0,100);save();view="result";paint();speak("Missão concluída! Muito bem por tentar!")}
function result(){app.innerHTML=header("Missão concluída!")+'<div class="panel" style="text-align:center"><div style="font-size:6rem" aria-hidden="true">🏆</div><h2>Você chegou ao final!</h2><p>Ganhou estrelas por participar e praticar. O importante é continuar tentando, sem pressa.</p><p style="font-size:2rem">⭐ '+data.history[0].stars+'</p><div class="row" style="justify-content:center">'+button("Outra aventura","home")+button("Repetir esta","detail","secondary")+'</div></div>'}
function achievements(){app.innerHTML=header("Meu progresso")+'<div class="panel"><h2>⭐ '+data.stars+' estrelas conquistadas</h2><p>As estrelas registram prática, não medem valor, capacidade ou obediência.</p><h3>Últimas aventuras</h3>'+(data.history.length?data.history.slice(0,20).map(h=>'<p class="pill">'+esc(h.name)+' · '+({learn:"Aprender",do:"Fazer",remember:"Lembrar"}[h.mode]||"Missão")+' · ⭐ '+h.stars+' · '+new Date(h.date).toLocaleDateString("pt-BR")+'</p>').join(""):'<p class="muted">Nenhuma aventura ainda. Vamos começar?</p>')+'</div>'}
function parent(){app.innerHTML=header("Área do responsável")+'<div class="panel"><div class="notice">As configurações são locais neste navegador. Esta versão não tem autenticação ou bloqueio parental; use acompanhando a criança e sem dados sensíveis.</div><fieldset><legend>Preferências</legend><label for="player">Nome exibido</label><input id="player" maxlength="35" value="'+esc(data.name)+'"><label><input type="checkbox" id="sound" style="width:auto" '+(data.sound?"checked":"")+'> Narração automática ao abrir um passo</label>'+button("Salvar preferências","preferences")+'</fieldset><h2>Missões disponíveis</h2><div class="stack">'+data.missions.map(m=>'<div class="row between"><strong>'+esc(m.icon)+' '+esc(m.name)+'</strong><div class="row">'+button("Editar","edit:"+esc(m.id),"secondary tiny")+button("Excluir","delete:"+esc(m.id),"danger tiny")+'</div></div>').join("")+'</div><hr style="border-color:#455e82;margin:20px 0">'+button("＋ Criar missão","new")+' <div class="row" style="margin-top:18px">'+button("⬇ Exportar backup","export","secondary")+button("⬆ Importar backup","import","secondary")+button("Restaurar missões iniciais","restore","ghost")+'</div><input id="importFile" type="file" accept="application/json,.json" class="hidden"><p class="muted">O backup inclui nome, missões e histórico; guarde-o em local privado. A importação substitui os dados atuais.</p></div>'}
function editor(){const m=mission||{name:"",icon:"🧩",place:"",steps:[["⭐","",""]]};app.innerHTML=header(mission?"Editar missão":"Criar missão","parent")+'<div class="panel"><form id="missionForm"><label for="mname">Nome da missão</label><input id="mname" maxlength="65" required value="'+esc(m.name)+'"><label for="micon">Ícone (emoji)</label><input id="micon" maxlength="12" value="'+esc(m.icon)+'"><label for="mplace">Ambiente</label><input id="mplace" maxlength="45" value="'+esc(m.place)+'"><label for="msteps">Etapas — uma por linha, separadas por |</label><textarea id="msteps" rows="12" required placeholder="🚪 | Abrir a porta | Abra a porta com cuidado.">'+esc(m.steps.map(s=>s.join(" | ")).join("\n"))+'</textarea><p class="muted">Formato: emoji | título curto | explicação que será narrada. Entre 2 e 20 etapas.</p><button class="primary" type="submit">Salvar missão</button></form><p id="formError" role="alert"></p></div>'}
function start(m){mode=m;index=0;selection=[];candidate=mission.steps.map((_,i)=>i);if(mode==="remember"){for(let i=candidate.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidate[i],candidate[j]]=[candidate[j],candidate[i]]}}view="play";paint();if(mode!=="remember"&&data.sound)speak(mission.steps[0][1]+". "+mission.steps[0][2])}
function doAction(a){if(a==="home"||a==="missions"){stop();view="home";paint();if(a==="missions")document.getElementById("missions").scrollIntoView();return}
if(a==="parent"||a==="achievements"||a==="detail"){stop();view=a;paint();return}
if(a.startsWith("open:")){mission=data.missions.find(m=>m.id===a.slice(5));if(mission){view="detail";paint()}return}
if(a.startsWith("start:")){start(a.slice(6));return}
if(a==="speak"){const s=mission.steps[index];speak(s[1]+". "+s[2]);return}
if(a==="prev"){index=Math.max(0,index-1);paint();return}
if(a==="next"){if(index===mission.steps.length-1)complete();else{index++;paint();if(data.sound){const s=mission.steps[index];speak(s[1]+". "+s[2])}}return}
if(a==="restart"){start(mode);return}
if(a==="hint"){const s=mission.steps[selection.length];speak("Uma dica: "+s[1]);document.getElementById("feedback").textContent="💡 Dica: "+s[0]+" "+s[1];return}
if(a.startsWith("pick:")){const p=Number(a.slice(5)),selected=candidate[p],expected=selection.length;if(selected===expected){selection.push(selected);candidate.splice(p,1);if(selection.length===mission.steps.length)complete();else{paint();announce("Acertou! Próximo passo.")}}else{document.getElementById("feedback").textContent="Quase! Tente outra opção, ou peça uma dica.";speak("Boa tentativa. Vamos tentar outra opção?")}return}
if(a==="preferences"){data.name=(document.getElementById("player").value.trim()||"Jogador").slice(0,35);data.sound=document.getElementById("sound").checked;save();paint();announce("Preferências salvas.");return}
if(a==="new"){mission=null;view="editor";paint();return}
if(a.startsWith("edit:")){mission=data.missions.find(m=>m.id===a.slice(5));view="editor";paint();return}
if(a.startsWith("delete:")){const id=a.slice(7);if(confirm("Excluir esta missão?")){if(data.missions.length===1){alert("Deixe pelo menos uma missão cadastrada.");return}data.missions=data.missions.filter(m=>m.id!==id);save();paint()}return}
if(a==="restore"){if(confirm("Restaurar as 10 missões originais? Missões personalizadas serão mantidas.")){const ids=new Set(data.missions.map(x=>x.id));DEFAULT.forEach(m=>{const at=data.missions.findIndex(x=>x.id===m.id);if(at>=0)data.missions[at]=clone(m);else data.missions.push(clone(m))});save();paint()}return}
if(a==="export"){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="davi-missoes-backup.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
if(a==="import"){document.getElementById("importFile").click();return}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(b)doAction(b.dataset.action)});
document.getElementById("homeBtn").addEventListener("click",()=>doAction("home"));
document.addEventListener("submit",e=>{if(e.target.id!=="missionForm")return;e.preventDefault();const lines=document.getElementById("msteps").value.split("\n").map(x=>x.trim()).filter(Boolean);const parts=lines.map(l=>l.split("|").map(x=>x.trim()));const error=document.getElementById("formError");if(parts.length<2||parts.length>20||parts.some(p=>p.length!==3||!p[1]||!p[2])){error.textContent="Informe de 2 a 20 linhas no formato emoji | título | instrução.";return}const item={id:mission?mission.id:"custom-"+Date.now().toString(36),name:document.getElementById("mname").value.trim().slice(0,65),icon:document.getElementById("micon").value.trim().slice(0,12)||"🧩",place:document.getElementById("mplace").value.trim().slice(0,45)||"Casa",steps:parts.map(p=>[p[0]||"⭐",p[1].slice(0,90),p[2].slice(0,250)])};if(!item.name){error.textContent="Informe um nome.";return}const at=data.missions.findIndex(m=>m.id===item.id);if(at>=0)data.missions[at]=item;else data.missions.push(item);save();mission=item;view="detail";paint()});
document.addEventListener("change",async e=>{if(e.target.id!=="importFile")return;const file=e.target.files[0];if(!file)return;try{if(file.size>300000){alert("Arquivo muito grande.");return}const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.missions)||parsed.missions.length<1||parsed.missions.length>100||!parsed.missions.every(m=>typeof m.id==="string"&&typeof m.name==="string"&&typeof m.icon==="string"&&typeof m.place==="string"&&Array.isArray(m.steps)&&m.steps.length>=2&&m.steps.length<=20&&m.steps.every(s=>Array.isArray(s)&&s.length===3&&s.every(v=>typeof v==="string")))){throw Error("Formato inválido")}if(!confirm("Importar backup e substituir os dados atuais?"))return;data={missions:parsed.missions,stars:Number.isFinite(parsed.stars)?Math.max(0,parsed.stars):0,history:Array.isArray(parsed.history)?parsed.history.slice(0,100):[],name:typeof parsed.name==="string"?parsed.name.slice(0,35):"Davi",sound:parsed.sound!==false};save();mission=null;view="parent";paint()}catch(err){alert("Não foi possível importar este arquivo JSON.")}});
window.addEventListener("beforeunload",stop);
paint();
})();
</script>
